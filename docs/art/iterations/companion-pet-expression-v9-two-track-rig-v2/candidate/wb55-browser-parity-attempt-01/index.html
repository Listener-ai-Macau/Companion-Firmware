<script>const all=[...document.querySelectorAll('#strip figure')],player=document.querySelector('#player'),strip=document.querySelector('#strip'),select=document.querySelector('#story'),restart=document.querySelector('#restart');let frames=[],index=0,timer=0;function visible(){for(const frame of all)frame.hidden=frame.dataset.score!==select.value;}function show(){const frame=frames[index];player.replaceChildren(frame.cloneNode(true));timer=setTimeout(()=>{if(index+1>=frames.length&&select.value==='menu_entry_notice'){player.replaceChildren();return;}index=(index+1)%frames.length;show();},Number(frame.dataset.duration));}function choose(reset){clearTimeout(timer);frames=all.filter(frame=>frame.dataset.score===select.value);if(reset)index=0;visible();show();}select.addEventListener('change',()=>choose(true));restart.addEventListener('click',()=>choose(true));choose(true);</script></html>
